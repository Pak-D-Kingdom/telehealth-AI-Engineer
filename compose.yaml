services:
  telehealth-ai:
    build: .
    container_name: telehealth_ai
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@pgvector:5432/telehealth_db
    volumes:
      - .:/app
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: telehealth_pgvector
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: telehealth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telehealth_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

